<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <meta name="theme-color" content="#2563EB" />
    <title>Kindred — Donate to causes that matter</title>
    <meta name="description" content="Support meaningful causes through secure donations. Help fund medical care, education, environment, and creative projects." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Inline initial-load spinner — shown immediately, before React loads */
      html, body { margin: 0; padding: 0; background: #FFFFFF; }
      body {
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
        color: #111827;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #FFFFFF;
        z-index: 9999;
      }
      #initial-loader .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #F3F4F6;
        border-top-color: #2563EB;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #initial-loader .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 22px;
        font-weight: 700;
        color: #111827;
        letter-spacing: -0.02em;
      }
      #initial-loader .mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #2563EB;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
      <div class="brand"><span class="mark">K</span> Kindred</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
